<form #formularz="ngForm" (submit)="onSubmit(formularz)">
    <div>
        <label for="imie">Imię: </label>
        <input required minlength="3" type="text" name="imie" id="imie" [(ngModel)]="name" (ngModelChange)="onNameChanged($event)" />
    </div>
    <div>
        <label for="nazwisko">Nazwisko: </label>
        <input required minlength="5" type="text" name="nazwisko" id="nazwisko" [(ngModel)]="surname" />
    </div>
    <div>
        <label for="dateOfBirth">Data urodzenia: </label>
        <input required type="date" name="dateOfBirth" id="dateOfBirth" [(ngModel)]="dateOfBirth" />
    </div>

    <button type="button">Przycisk</button>
    <input type="button" value="Przycisk z input type = button" />
    <input [disabled]="!formularz.valid" type="submit" name="submit" value="Zapisz" />
</form>

<div>
    <h3>Powstanie obiekt:</h3>

    <div>
        Imię: {{name}}
    </div>
    <div>
        Nazwisko: {{surname}}
    </div>
    <div>
        Data urodzenia: {{dateOfBirth}}
    </div>
    <div>
        <button (click)="reset()">Reset</button>
    </div>
</div>
